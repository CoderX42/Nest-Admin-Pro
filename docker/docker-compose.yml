name: nest-admin-pro

services:
  mysql:
    image: mysql:8.4
    container_name: nest-admin-pro-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nestadmin}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nest_admin_pro}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nest-admin-pro

  redis:
    image: redis:7-alpine
    container_name: nest-admin-pro-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    command: >
      sh -c 'redis-server --appendonly yes
      $${REDIS_PASSWORD:+--requirepass "$${REDIS_PASSWORD}"}'
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli $${REDIS_PASSWORD:+-a "$${REDIS_PASSWORD}"} ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - nest-admin-pro

volumes:
  mysql-data:
  redis-data:

networks:
  nest-admin-pro:
    driver: bridge
